spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loldle}
    username: ${DB_USERNAME:loldle}
    password: ${DB_PASSWORD:loldle_local_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
       dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  application:
    name: Loldle1vs1

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  champions:
    auto-populate: ${AUTO_POPULATE_CHAMPIONS:true}

riot:
  ddragon:
    base-url: ${DDRAGON_BASE_URL:https://ddragon.leagueoflegends.com}
  universe:
    base-url: ${UNIVERSE_BASE_URL:https://universe-meeps.leagueoflegends.com/v1/en_us}
